[workspace]
resolver = "2"
members = [
    "crates/aura-core",
    "crates/aura-protocol",
    "crates/aura-memory",
    "crates/aura-tools",
    "crates/aura-agent",
    "crates/aura-planner",
    "crates/aura-inference",
    "crates/aura-vision",
    "crates/aura-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AURA Project"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
