[package]
name = "aura-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
android = ["dep:jni"]

[dependencies]
aura-core = { path = "../aura-core" }
aura-protocol = { path = "../aura-protocol" }
aura-agent = { path = "../aura-agent" }
aura-tools = { path = "../aura-tools" }
aura-memory = { path = "../aura-memory" }
aura-planner = { path = "../aura-planner" }
aura-inference = { path = "../aura-inference" }
aura-vision = { path = "../aura-vision" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }

jni = { version = "0.21", optional = true }
